# Copie este arquivo para config.yaml e ajuste para o seu caso.
# Nunca coloque chave de API/senha da corretora aqui — isso vai no .env.

capital:
  initial: 1000
  risk_per_trade_pct: 0.005 # % do capital arriscado por trade (0.5%)
  daily_loss_limit_pct: 0.02 # robô para de operar se perder 2% do capital no dia
  daily_profit_target_pct: 0.03 # robô trava lucro ao ganhar 3% no dia (null para desativar)
  max_trades_per_day: 4
  point_value: 1.0 # valor financeiro de 1 unidade de preço por contrato (1.0 para cripto/ações)
  quantity_step: 0.001 # menor fração negociável do ativo (BTC/USDT na Binance = 0.001).
                        # Ações/mini-índice/MT5: use 1.0 (quantidade inteira).
                        # Confira o valor certo do seu símbolo antes de operar de verdade.

market:
  # "binance_futures" (funciona nativamente no Mac, sem VM) | "yfinance" (só backtest de ações B3) | "mt5" (só Windows)
  provider: binance_futures
  symbol: "BTC/USDT" # formato ccxt. Para yfinance use ex. "PETR4.SA". Para MT5 use o código da corretora, ex. "WIN$"
  timeframe: "5m" # 1m, 5m, 15m, 30m, 1h, 1d

exchange:
  testnet: true # true = https://testnet.binancefuture.com (dinheiro fictício, dados/execução reais)
  leverage: 1 # comece em 1x. Alavancagem maior = risco de liquidação maior.

strategy:
  # DAY TRADE (use com market.timeframe de minutos, ex. "5m"):
  #   "orb" (rompimento) | "ema_rsi" (cruzamento de médias) | "mean_reversion" (reversão à
  #   média via Bandas de Bollinger + RSI) | "funding_rate" (contrária ao funding rate extremo)
  # SWING TRADE (use com market.timeframe: "1d" ou "4h", sem fechamento no mesmo dia):
  #   "donchian" (rompimento de canal — sistema clássico dos "Turtle Traders")
  name: orb
  session_open_time: "00:00" # cripto é 24/7; isso define a "abertura do dia" para o range e o reset diário de risco
  range_minutes: 15
  risk_reward: 2.0
  session_close_time: "23:55" # robô zera a posição perto da virada do dia, disciplina de day trade mesmo em mercado 24/7
  # trend_filter_period: 200 # opcional, só para "orb": só compra rompimento de alta
  #   se o preço estiver acima da média móvel desse período (e só vende rompimento
  #   de baixa se estiver abaixo). Deixe comentado (ou remova) para não filtrar.
  # entry_channel_period: 20 # só para "donchian": tamanho do canal (em velas) usado
  #   para detectar o rompimento — 20 velas diárias é o clássico dos Turtle Traders.

backtest:
  start: "2024-06-01"
  end: "2024-08-01"
  slippage_pct: 0.0005 # 0.05% de deslizamento em cada execução
  commission_pct: 0.0005 # 0.05% por execução (taxa "taker" típica de futuros na Binance,
                          # cobrada tanto na entrada quanto na saída)
  commission_per_trade: 0.0 # custo FIXO por operação — use isso (não commission_pct)
                            # se migrar para B3/MT5, onde a corretagem costuma ser um
                            # valor fixo por operação em vez de percentual

paper:
  poll_interval_seconds: 30
  warmup_days: 5
