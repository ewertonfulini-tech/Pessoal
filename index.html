<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Meu Gestor Financeiro</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- PWA / instalar na tela inicial -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f1420" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Meu Gestor" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">₣</div>
        <div class="brand-text">
          <strong>Meu Gestor</strong>
          <span>Financeiro pessoal</span>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-tab="dashboard">
          <span class="nav-icon">◱</span><span class="nav-label">Início</span>
        </button>
        <button class="nav-item" data-tab="despesas">
          <span class="nav-icon">▼</span><span class="nav-label">Despesas</span>
        </button>
        <button class="nav-item" data-tab="receitas">
          <span class="nav-icon">▲</span><span class="nav-label">Receitas</span>
        </button>
        <button class="nav-item" data-tab="cartoes">
          <span class="nav-icon">▭</span><span class="nav-label">Cartões</span>
        </button>
        <button class="nav-item" data-tab="orcamento">
          <span class="nav-icon">◧</span><span class="nav-label">Orçamento</span>
        </button>
        <button class="nav-item" data-tab="contas">
          <span class="nav-icon">◉</span><span class="nav-label">Contas</span>
        </button>
        <button class="nav-item" data-tab="config">
          <span class="nav-icon">⚙</span><span class="nav-label">Ajustes</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <span>Dados salvos neste navegador</span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="month-picker">
          <button id="prevMonth" class="icon-btn" title="Mês anterior">‹</button>
          <span id="currentMonthLabel">—</span>
          <button id="nextMonth" class="icon-btn" title="Próximo mês">›</button>
          <button id="todayBtn" class="ghost-btn" title="Voltar ao mês atual">Hoje</button>
        </div>
      </header>

      <section id="view" class="view"><!-- rendered by JS --></section>
    </main>
  </div>

  <!-- Botão flutuante (adicionar) -->
  <div id="fab" class="fab">
    <div class="fab-actions" id="fabActions" hidden>
      <button class="fab-action" data-action="income">
        <span class="fab-a-label">Receita</span>
        <span class="fab-a-dot success">＋</span>
      </button>
      <button class="fab-action" data-action="expense">
        <span class="fab-a-label">Despesa</span>
        <span class="fab-a-dot danger">＋</span>
      </button>
      <button class="fab-action" data-action="card">
        <span class="fab-a-label">Despesa no cartão</span>
        <span class="fab-a-dot primary">▭</span>
      </button>
    </div>
    <button class="fab-main" id="fabMain" aria-label="Adicionar lançamento">＋</button>
  </div>
  <div class="fab-backdrop" id="fabBackdrop" hidden></div>

  <!-- Modal container -->
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/finance.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sync.js"></script>
</body>
</html>
